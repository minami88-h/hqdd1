; ============================================================
;  SimpleFOC current-mode FOC on hqdd_1 custom board
;  MCU    : STM32G431KBUx (UFQFPN32, 128KB flash / 32KB RAM)
;  Driver : DRV8311H (on-board) + low-side current sense
;  Sensor : AS5600L (I2C)
;  Motor  : gimbal motor, pole_pairs=7 (unchanged from the Nucleo-G474RE version)
;
;  Pin mapping was reverse-engineered from hardware/mcu.kicad_sch
;  (STM32G431KBUx + DRV8311H + AS5600L + TCAN330) -- see src/main.cpp
;  header comment for the full table and caveats.
;
;  No on-board ST-Link: flash via an external ST-Link on the
;  SWDIO/SWCLK header (J2), debug serial via USB-TTL adapter on J3.
; ============================================================
[env:hqdd1_g431kb]
platform      = ststm32
board         = genericSTM32G431KBUX
board_build.core = stm32
framework     = arduino
upload_protocol = stlink
monitor_speed = 115200
; シリアルモニタから改行(LF)付きでコマンド送信 (SimpleFOC Commanderは'\n'で確定)
monitor_eol = LF
monitor_echo = yes
monitor_filters = send_on_enter, colorize
; ★重要: SimpleFOCを静的archiveにせず直接リンク(low-side CSの弱シンボル対策)
lib_archive = no

; ビルドごとに固有IDを生成(書き込み直すと保存済みパラメータ/IDを無効にしてコードの値を使う)
extra_scripts = pre:scripts/gen_build_id.py

lib_deps =
    askuric/Simple FOC@^2.3.4

; CAN(FDCAN)は pierremolinaro/ACANFD_STM32 からG431向け部分だけを
; src/can_driver/ に取り込んで使っている(ライブラリとしては追加していない。
; 理由はsrc/can_link.cppの取り込み部コメント参照)。

build_flags =
    ; デバッグSerialのピンをhqdd_1基板の配線(USART2: TX=PA2 / RX=PA15)に固定
    ; 回路図のネット名は "UART_RX"=PA2 / "UART_TX"=PA15 だが、これは外部機器から
    ; 見た向きの命名。MCUのハードウェアUSART2としてはPA2がTX、PA15がRXでないと
    ; 動かない(PeripheralPins.cのAFテーブルで確認済み)ので、ここではMCU視点の
    ; 役割で固定する。J3コネクタに繋ぐUSB-TTLアダプタ側は TXD->基板PA15(MCUのRX)、
    ; RXD->基板PA2(MCUのTX) に接続すること(回路図ラベル通り)。
    ; ★PA2は素のままだとPinMap上LPUART1 TXに解決されてしまう(USART2 TXは
    ;   ALT1側のエントリ)。PA2_ALT1を指定してUSART2 TXを明示的に選択する。
    ;   (SERIAL_UART_INSTANCEはこのコアのHardwareSerialでは参照されない
    ;   ので指定しても効果がない)
    -D PIN_SERIAL_TX=PA2_ALT1
    -D PIN_SERIAL_RX=PA15
