# HQDD1 Web UI を GitHub Pages に公開する(静的ファイルのみ。CANはローカルサーバが必要なので対象外)
name: Deploy Web UI
on:
  push:
    branches: [main]
    paths:
      - 'webui/static/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webui/static
      - id: deployment
        uses: actions/deploy-pages@v4
